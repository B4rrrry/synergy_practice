<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Consult Helper — консультант</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #f5f5f5;
        color: #1f1f1f;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        padding: 24px 32px 40px;
        box-shadow: 0 12px 40px rgba(13, 24, 34, 0.15);
      }

      h1 {
        margin-top: 0;
        font-size: 28px;
      }

      fieldset {
        border: 1px solid #d0d7de;
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 24px;
      }

      legend {
        font-weight: 600;
      }

      .cases {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px 24px;
      }

      label {
        display: flex;
        gap: 8px;
        align-items: baseline;
        cursor: pointer;
      }

      button {
        font-size: 16px;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        background: #1f7aec;
        color: #fff;
      }

      button.secondary {
        background: #b7bec8;
        color: #1f1f1f;
        margin-left: 12px;
      }

      .results {
        margin-top: 32px;
      }

      .card {
        border: 1px solid #d0d7de;
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 16px;
        background: #fbfbfd;
      }

      .category {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #5b6b7c;
      }

      .message {
        font-size: 18px;
        margin: 10px 0;
      }

      .rationale {
        font-size: 14px;
        color: #4b5563;
      }

      .empty {
        color: #6b7280;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Consult Helper — консультант</h1>
      <p>
        Отметьте актуальные кейсы поддержки и нажмите «Получить рекомендации».
        Набор правил совпадает с базой знаний <code>consult_helper.clp</code>,
        поэтому результат идентичен с запуском <code>(run-scenario …)</code>.
      </p>

      <form id="caseForm">
        <fieldset>
          <legend>Выберите кейсы</legend>
          <div class="cases">
            <label>
              <input type="checkbox" name="topics" value="access" />
              Доступ к дашборду
            </label>
            <label>
              <input type="checkbox" name="topics" value="data-refresh" />
              Долго загружаются данные
            </label>
            <label>
              <input type="checkbox" name="topics" value="release" />
              Подача релиза
            </label>
            <label>
              <input type="checkbox" name="topics" value="ticket-wait" />
              Перевод обращения в ожидание
            </label>
            <label>
              <input type="checkbox" name="topics" value="encoding" />
              Слетела кодировка скрипта
            </label>
          </div>
        </fieldset>
        <button type="submit">Получить рекомендации</button>
        <button type="button" class="secondary" id="resetBtn">Сбросить</button>
      </form>

      <section class="results" id="results">
        <p class="empty">Пока ничего не выбрано.</p>
      </section>
    </main>

    <script>
      const CASES = {
        access: {
          category: "Access management",
          message:
            "Запроси доменную группу доступа из спецификации и добавь пользователя в AD перед выдачей доступа к дашборду.",
          rationale:
            "В спецификации зафиксированы допустимые группы Active Directory; нарушение цепочки доступа запрещено.",
        },
        "data-refresh": {
          category: "Data refresh",
          message:
            "Проверь, не открыт ли Excel-файл источника заказчиком, попроси закрыть его и перезапусти обновление данных.",
          rationale:
            "Блокировка файла во время обновления вызывает ошибки выгрузки; повторный запуск после закрытия Excel восстанавливает процесс.",
        },
        release: {
          category: "Release management",
          message:
            "Сформируй спецификацию приложения, Release Notes, подай заявку на установку и согласуй релиз с ИБ и архитекторами.",
          rationale:
            "Установка возможна только при наличии полного пакета артефактов и прохождении обязательных согласований.",
        },
        "ticket-wait": {
          category: "Communication",
          message:
            "Перед переводом обращения в ожидание согласуй это действие с инициатором и зафиксируй договорённость.",
          rationale:
            "Перевод без согласования нарушает SLA и вызывает недовольство заказчика.",
        },
        encoding: {
          category: "Development",
          message:
            "Перекодируй скрипт в UTF-8 + BOM и перезапусти обработку.",
          rationale:
            "В производственном контуре ожидается UTF-8 + BOM; иная кодировка приводит к ошибкам интерпретации.",
        },
      };

      const form = document.getElementById("caseForm");
      const results = document.getElementById("results");
      const resetBtn = document.getElementById("resetBtn");

      const renderResults = (topics) => {
        if (!topics.length) {
          results.innerHTML =
            '<p class="empty">Выберите хотя бы один кейс, чтобы получить рекомендации.</p>';
          return;
        }

        results.innerHTML = "";
        topics.forEach((topic) => {
          const data = CASES[topic];
          if (!data) {
            return;
          }
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="category">${data.category}</div>
            <div class="message">${data.message}</div>
            <div class="rationale"><strong>Почему:</strong> ${data.rationale}</div>
          `;
          results.appendChild(card);
        });
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const selected = formData.getAll("topics");
        renderResults(selected);
      });

      resetBtn.addEventListener("click", () => {
        form.reset();
        renderResults([]);
      });

      renderResults([]);
    </script>
  </body>
</html>
